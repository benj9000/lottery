[project]
name = "lottery"
version = "0.1.0"
description = "Evaluating lottery tickets."
readme = "README.md"
authors = [
    { name = "benj9000", email = "49900294+benj9000@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
lottery-ticket = "lottery.presentation.cli.cli:cli"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
